{% extends "base.html" %}

{% block title %}
Create Security Event
{% endblock %}


{% block content %}

<h2>Create Security Event</h2>

<div class="form-card">

<form method="POST">


    <div class="form-group">

        <label>Event Type</label>

        <select
            name="event_type"
            id="event_type"
            onchange="showEventFields()"
            required>

            <option value="failed_login">
                Failed Login
            </option>

            <option value="malware_detection">
                Malware Detection
            </option>

            <option value="phishing">
                Phishing
            </option>

            <option value="network_anomaly">
                Network Anomaly
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>Severity</label>

        <select name="severity" required>

            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>

        </select>

    </div>


    <div class="form-group">

        <label>Timestamp</label>

        <input
            type="datetime-local"
            name="timestamp"
            required>

    </div>


    <div class="form-group">

        <label>Description</label>

        <textarea
            name="description"
            rows="4"
            required></textarea>

    </div>


    <!-- Failed Login -->

    <div
        id="failed_login_fields"
        class="event-fields">

        <h3>Failed Login Information</h3>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username">
        </div>

        <div class="form-group">
            <label>Source IP Address</label>
            <input type="text" name="source_ip">
        </div>

        <div class="form-group">
            <label>Hostname</label>
            <input type="text" name="hostname">
        </div>

        <div class="form-group">
            <label>Number of Failed Attempts</label>
            <input
                type="number"
                min="1"
                name="failed_attempts">
        </div>

    </div>


    <!-- Malware -->

    <div
        id="malware_detection_fields"
        class="event-fields"
        style="display:none;">

        <h3>Malware Information</h3>

        <div class="form-group">
            <label>Hostname</label>
            <input type="text" name="hostname">
        </div>

        <div class="form-group">
            <label>Source IP Address</label>
            <input type="text" name="source_ip">
        </div>

        <div class="form-group">
            <label>Malware Name</label>
            <input type="text" name="malware_name">
        </div>

        <div class="form-group">
            <label>File Path</label>
            <input type="text" name="file_path">
        </div>

    </div>


    <!-- Phishing -->

    <div
        id="phishing_fields"
        class="event-fields"
        style="display:none;">

        <h3>Phishing Information</h3>

        <div class="form-group">
            <label>Sender Email</label>
            <input type="email" name="sender_email">
        </div>

        <div class="form-group">
            <label>Recipient Email</label>
            <input type="email" name="recipient_email">
        </div>

        <div class="form-group">
            <label>Email Subject</label>
            <input type="text" name="subject">
        </div>

    </div>


    <!-- Network Anomaly -->

    <div
        id="network_anomaly_fields"
        class="event-fields"
        style="display:none;">

        <h3>Network Information</h3>

        <div class="form-group">
            <label>Source IP Address</label>
            <input type="text" name="source_ip">
        </div>

        <div class="form-group">
            <label>Destination IP Address</label>
            <input type="text" name="destination_ip">
        </div>

        <div class="form-group">
            <label>Source Port</label>
            <input
                type="number"
                min="0"
                max="65535"
                name="source_port">
        </div>

        <div class="form-group">
            <label>Destination Port</label>
            <input
                type="number"
                min="0"
                max="65535"
                name="destination_port">
        </div>

        <div class="form-group">

            <label>Protocol</label>

            <select name="protocol">
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
                <option value="ICMP">ICMP</option>
                <option value="Other">Other</option>
            </select>

        </div>

    </div>


    <div class="action-area">

        <button type="submit">
            Create Event
        </button>

        <a class="button"
           href="{{ url_for('events_page') }}">
            Cancel
        </a>

    </div>


</form>

</div>


<script>

function showEventFields() {

    const eventType =
        document.getElementById("event_type").value;

    const sections = [
        "failed_login_fields",
        "malware_detection_fields",
        "phishing_fields",
        "network_anomaly_fields"
    ];

    sections.forEach(function(section) {
        document.getElementById(section).style.display = "none";
    });

    document.getElementById(
        eventType + "_fields"
    ).style.display = "block";
}

</script>

{% endblock %}
